name: FlyCoral Automatic Alerts

on:
  schedule:
    # Se ejecuta todos los lunes a las 12:00 UTC (09:00 hs de Argentina)
    - cron: '0 12 * * 1'
  workflow_dispatch: # Permite disparar la prueba manual cuando quieras

jobs:
  check-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flight check & send alert
        env:
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python send_alert.py
