name: FlyCoral Automatic Alerts

on:
workflow_dispatch:
schedule:
# Se ejecuta todos los días a las 12:00 UTC (09:00 hs Argentina ART)
- cron: '0 12 * * *'

jobs:
run-alerts:
runs-on: ubuntu-latest
steps:
- name: Descargar repositorio
uses: actions/checkout@v4

  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
      cache: 'pip'

  - name: Instalar dependencias
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Ejecutar script de envío de alertas
    env:
      YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SENDER_EMAIL: "diego.1202@yahoo.com"
      RECIPIENT_EMAIL: "diego.1202@yahoo.com"
    run: |
      python send_alert.py
